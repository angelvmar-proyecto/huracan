<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>🌊 MAR Caribe Huracanes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, sans-serif; 
            background: #0a0804; color: #f5e6c8; 
            position: fixed; top: 0; left: 0;
        }
        #header {
            background: linear-gradient(135deg, #d4a843, #b8860b, #8b6914);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 1000; height: 48px;
            box-shadow: 0 2px 20px rgba(184, 134, 11, 0.4);
        }
        #header h1 { 
            font-size: 17px; font-weight: 800; color: #fff8e7;
            text-shadow: 0 1px 8px rgba(0,0,0,0.3);
        }
        #header .badge {
            background: rgba(255, 248, 231, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #fff8e7;
            border: 1px solid rgba(255, 248, 231, 0.15);
        }
        #map {
            position: fixed;
            top: 48px; left: 0; right: 0; bottom: 0;
            width: 100%;
            background: #0a0804;
            z-index: 1;
        }
        #info {
            position: fixed;
            bottom: 10px; left: 10px; right: 10px;
            background: rgba(10, 8, 4, 0.92);
            backdrop-filter: blur(15px);
            padding: 10px 12px;
            border-top: 3px solid #d4a843;
            border-radius: 14px;
            z-index: 1000;
            max-height: 40vh;
            overflow-y: auto;
            box-shadow: 0 4px 40px rgba(0,0,0,0.9);
        }
        .tormenta-card {
            background: rgba(212, 168, 67, 0.06);
            border: 1px solid rgba(212, 168, 67, 0.15);
            border-radius: 8px;
            padding: 8px 10px;
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tormenta-card .icono { font-size: 28px; width: 40px; text-align: center; }
        .tormenta-card .info { flex: 1; }
        .tormenta-card .nombre { font-weight: 700; font-size: 14px; color: #f5e6c8; }
        .tormenta-card .categoria {
            font-size: 11px; font-weight: 600;
            padding: 2px 8px; border-radius: 10px;
            display: inline-block; margin-top: 2px;
        }
        .cat-huracan { background: rgba(255,150,0,0.2); color: #ff9600; }
        .cat-tormenta { background: rgba(255,200,0,0.2); color: #f5d742; }
        .cat-depresion { background: rgba(0,200,255,0.2); color: #00ccff; }
        .loading { text-align: center; color: #8a7a5a; font-size: 13px; padding: 10px; }
        #refresh-btn {
            position: fixed;
            bottom: 120px;
            right: 16px;
            background: linear-gradient(135deg, #d4a843, #b8860b);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            box-shadow: 0 4px 25px rgba(184, 134, 11, 0.5);
            z-index: 2000;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="header">
    <h1>🌊 MAR Caribe Huracanes</h1>
    <span class="badge" id="estado">🟢 CONECTANDO...</span>
</div>

<div id="map"></div>

<button id="refresh-btn" onclick="cargarTormentas()">↻</button>

<div id="info">
    <div style="font-weight:700;font-size:13px;color:#d4a843;margin-bottom:6px;">🌀 Sistemas Activos (NOAA)</div>
    <div id="tormentas-activas">
        <div class="loading">⏳ Consultando API y Cloudflare...</div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
